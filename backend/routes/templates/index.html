{% extends 'base.html' %}

{% block content %}
  <div class="flex justify-center items-center min-h-screen">
    <div class="text-center p-6 bg-white rounded-lg shadow-lg w-full max-w-md">
      <h1 class="text-3xl font-bold text-indigo-600 mb-6">Welcome to the route creation app!</h1>

      <a href="{% if user.is_authenticated %}{% url 'route_create' %}{% else %}{% url 'create_anonymous_route' %}{% endif %}" 
          class="inline-flex items-center justify-center px-8 py-4 border border-transparent text-base font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 md:text-lg transition transform hover:scale-105 shadow-lg">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Create route
      </a>

      {% if not user.is_authenticated %}
        <div class="mt-6 flex justify-center space-x-4">
          <a href="{% url 'login' %}" class="text-blue-600 font-semibold hover:text-blue-800 transition duration-300">
            Log in
          </a>
          <a href="{% url 'register' %}" class="text-blue-600 font-semibold hover:text-blue-800 transition duration-300">
            Register
          </a>
        </div>
      {% endif %}
    </div>
  </div>
{% endblock %}
